<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Party">
<meta name="theme-color" content="#2b2250" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Block Party</title>
<style>
:root{--bg1:#2b2250;--bg2:#5b2a86;--board:#1a1438;--empty:#2d2457;--text:#fff;--bs:min(94vw,calc(100dvh - 330px),480px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg1)}
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(160deg,var(--bg1),var(--bg2))}
#top{width:var(--bs);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{border:0;border-radius:999px;padding:10px 16px;font-size:18px;font-weight:800;color:var(--text);background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.scores{display:flex;gap:14px}
.scores div{text-align:center;line-height:1}
.scores small{display:block;font-size:11px;letter-spacing:.08em;opacity:.7;margin-bottom:3px}
.scores b{font-size:26px}
#boardwrap{position:relative;width:var(--bs);height:var(--bs)}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;padding:6px;width:100%;height:100%;background:var(--board);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.c{border-radius:7px;background:var(--empty);transition:background .08s}
.c.f{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.28)}
.c.hint{background:var(--h);opacity:.5}
.c.will{box-shadow:0 0 0 2px #fff,0 0 12px #fff;opacity:.9}
.c.clr{animation:pop .3s ease-out forwards}
@keyframes pop{0%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.18);filter:brightness(2)}100%{transform:scale(.1);opacity:0}}
#floaty{position:absolute;inset:0;pointer-events:none;overflow:visible}
.float{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:900;font-size:38px;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.6);animation:rise 1.1s ease-out forwards}
.emo{position:absolute;font-size:30px;animation:fly 1.1s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
#tray{width:var(--bs);display:flex;gap:8px;height:130px}
.slot{flex:1;display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(255,255,255,.08);touch-action:none}
.pbox{position:relative}
.pc{position:absolute;border-radius:5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.28)}
.slot.lift .pbox{opacity:.25}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;will-change:transform}
.gc{position:absolute;border-radius:7px;box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.28)}
#bar{display:flex;gap:14px;margin-top:6px}
#bar button{width:56px;height:56px;border:0;border-radius:50%;font-size:24px;background:rgba(255,255,255,.16);color:var(--text)}
#bar button:active{transform:scale(.92)}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;touch-action:auto}
#modal[hidden]{display:none}
.card{width:100%;max-width:380px;max-height:90dvh;overflow:auto;background:#fff;color:#222;border-radius:22px;padding:22px;text-align:center;-webkit-user-select:text;user-select:text}
.card h2{margin:0 0 12px;font-size:24px}
.card h3{margin:16px 0 8px;font-size:15px;opacity:.7}
.card p{margin:8px 0}
.err{color:#c0262d;min-height:1.2em;font-weight:700}
.card button{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:#eee;color:#222;font-weight:700}
.card button.big{background:#5b2a86;color:#fff;width:100%;margin-top:14px;font-size:18px;padding:14px}
.card .row{display:flex;gap:10px;margin-top:12px}.card .row button{flex:1}
.card input[type=text],.card input[type=password],.card select{font:inherit;width:100%;padding:10px 12px;border:2px solid #ddd;border-radius:12px;background:#fff;color:#222}
.card input[type=password]{text-align:center;font-size:28px;letter-spacing:.4em}
.plist,.tlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pbtn{flex:1 1 100%;display:flex;justify-content:space-between;align-items:center;font-size:18px!important}
.pbtn small,.tbtn small{opacity:.6;font-weight:600;font-size:12px}
.tbtn{flex:1 1 28%;font-size:26px!important;display:flex;flex-direction:column;align-items:center;gap:2px}
.on{outline:3px solid #5b2a86;background:#efe6fa!important}
.prow{border-top:1px solid #eee;padding-top:12px;margin-top:12px;text-align:left}
.prow label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-weight:600;font-size:15px}
.prow label select{width:auto}
.prow .mins{font-size:13px;opacity:.6;font-weight:600}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:90;animation:rise2 1.8s forwards}
@keyframes rise2{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="who" class="chip"></button>
    <div class="scores"><div><small>SCORE</small><b id="score">0</b></div><div><small>BEST</small><b id="best">0</b></div></div>
  </div>
  <div id="boardwrap"><div id="board"></div><div id="floaty"></div></div>
  <div id="tray"><div class="slot" data-i="0"></div><div class="slot" data-i="1"></div><div class="slot" data-i="2"></div></div>
  <div id="bar"><button id="btnNew" aria-label="New game">⟳</button><button id="btnSound" aria-label="Sound">🔊</button><button id="btnParent" aria-label="Parent settings">⚙️</button></div>
</div>
<div id="modal" hidden><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
const N = 8;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Shapes ---------- */
const RAW = [
  ['#'], ['##'], ['#','#'], ['###'], ['#','#','#'], ['####'], ['#','#','#','#'], ['#####'], ['#','#','#','#','#'],
  ['##','##'], ['###','###','###'], ['###','###'], ['##','##','##'],
  ['#.','##'], ['.#','##'], ['##','#.'], ['##','.#'],
  ['#..','#..','###'], ['..#','..#','###'], ['###','#..','#..'], ['###','..#','..#'],
  ['###','.#.'], ['.#.','###'], ['#.','##','#.'], ['.#','##','.#'],
  ['##.','.##'], ['.##','##.'], ['#.','##','.#'], ['.#','##','#.'],
  ['#.','#.','##'], ['.#','.#','##'], ['##','#.','#.'], ['##','.#','.#']
];
const SHAPES = RAW.map(rows => {
  const cells = [];
  rows.forEach((s, r) => [...s].forEach((ch, c) => { if (ch === '#') cells.push([r, c]); }));
  return { cells, h: rows.length, w: rows[0].length };
});

/* ---------- Themes ---------- */
const THEMES = {
  candy: { name:'Candy', icon:'🍬', bg:['#2b2250','#5b2a86'], board:'#1a1438', empty:'#2d2457', fx:['⭐','🎉','🌈','✨'],
           pal:['#ff5d8f','#ffb703','#4cd964','#35c0ff','#a06bff','#ff7a3d','#2ee6c5'] },
  trail: { name:'Trail', icon:'🚴', bg:['#12372a','#2f6f4f'], board:'#0b2219', empty:'#1b4a37', fx:['🚴','🌲','⛰️','🍃'],
           pal:['#f2c14e','#f78154','#9ad17a','#5fb7d4','#e0e0c0','#c97b4a','#8fd8b0'] },
  barn:  { name:'Barn', icon:'🐴', bg:['#4a2511','#9a5b2c'], board:'#2d160a', empty:'#5e351d', fx:['🐴','🌾','⭐','🥕'],
           pal:['#f4a259','#e76f51','#e9c46a','#8ab17d','#c9ada7','#f6e8c3','#b56576'] },
  stage: { name:'Stage', icon:'🎭', bg:['#2a0a3d','#8a1c5c'], board:'#17061f', empty:'#3a1450', fx:['🎭','🎶','⭐','🎤'],
           pal:['#ffd166','#ef476f','#06d6a0','#118ab2','#c77dff','#ff9770','#f8f9fa'] },
  pets:  { name:'Pets', icon:'🐾', bg:['#1f2a44','#3d5a80'], board:'#2c3a4d', empty:'#5d7082', fx:['🐱','🐶','🐹','🐾'],
           pal:['#ffffff','#ff8c1a','#1c1c20','#f2c46d','#c4c9d0','#b5651d','#e8a87c'] },
  rink:  { name:'Rink', icon:'🏒', bg:['#0b2a4a','#2e7fb8'], board:'#07182b', empty:'#14416b', fx:['🏒','❄️','⭐','🥅'],
           pal:['#e63946','#f1faee','#a8dadc','#ffd166','#7ec8e3','#ff8fa3','#b8f2e6'] }
};

/* ---------- State ---------- */
const KEY = 'blockparty_v1';
const mkPlayer = (name, theme) => ({ name, theme, best:0, limit:0, calm:false, secs:0, day:'' });
const defaults = () => ({ v:2, players:[mkPlayer('Ollie','trail'), mkPlayer('Bridget','stage'), mkPlayer('Finley','candy'), mkPlayer('Mom','pets'), mkPlayer('Dad','rink')], cur:0, pin:'', sound:true });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch (e) { S = defaults(); }
if (!S.players || !S.players.length) S = defaults();
// Upgrade older saves: add Mom and Dad without touching existing players
if (!S.v || S.v < 2) {
  const has = n => S.players.some(p => String(p.name).toLowerCase() === n.toLowerCase());
  if (!has('Mom')) S.players.push(mkPlayer('Mom', 'pets'));
  if (!has('Dad')) S.players.push(mkPlayer('Dad', 'rink'));
  S.v = 2;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
const saveS = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const cur = () => S.players[S.cur];
const TH = () => THEMES[cur().theme] || THEMES.candy;
const gkey = () => KEY + '_g' + S.cur;
let G = null;
let busy = false;
let drag = null;

/* ---------- Board DOM ---------- */
const board = $('#board');
const cells = [];
for (let i = 0; i < N * N; i++) { const d = document.createElement('div'); d.className = 'c'; board.appendChild(d); cells.push(d); }
const slots = [...document.querySelectorAll('.slot')];

function applyTheme() {
  const t = TH(), r = document.documentElement.style;
  r.setProperty('--bg1', t.bg[0]); r.setProperty('--bg2', t.bg[1]);
  r.setProperty('--board', t.board); r.setProperty('--empty', t.empty);
  $('#themeColor').setAttribute('content', t.bg[0]);
  $('#who').textContent = t.icon + ' ' + cur().name;
}

function render() {
  const t = TH();
  for (let i = 0; i < N * N; i++) {
    const v = G.grid[(i / N) | 0][i % N];
    const el = cells[i];
    el.className = 'c' + (v >= 0 ? ' f' : '');
    el.style.background = v >= 0 ? t.pal[v] : '';
    el.style.removeProperty('--h');
  }
  $('#score').textContent = G.score;
  $('#best').textContent = cur().best;
  $('#btnSound').textContent = S.sound ? '🔊' : '🔇';
}

function renderTray() {
  const t = TH();
  slots.forEach((slot, i) => {
    slot.innerHTML = ''; slot.classList.remove('lift');
    const p = G.tray[i]; if (!p) return;
    const sh = SHAPES[p.s], pc = 21, gap = 3, pitch = pc + gap;
    const box = document.createElement('div'); box.className = 'pbox';
    box.style.width = (sh.w * pitch - gap) + 'px'; box.style.height = (sh.h * pitch - gap) + 'px';
    sh.cells.forEach(([r, c]) => {
      const d = document.createElement('div'); d.className = 'pc';
      d.style.cssText = `left:${c*pitch}px;top:${r*pitch}px;width:${pc}px;height:${pc}px;background:${t.pal[p.k]}`;
      box.appendChild(d);
    });
    slot.appendChild(box);
  });
}

/* ---------- Game logic ---------- */
const emptyGrid = () => Array.from({ length: N }, () => Array(N).fill(-1));
function canPlace(sh, r, c, grid = G.grid) {
  for (const [dr, dc] of sh.cells) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || cc < 0 || rr >= N || cc >= N || grid[rr][cc] >= 0) return false;
  }
  return true;
}
function anyFit(sh) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (canPlace(sh, r, c)) return true;
  return false;
}
function genTray() {
  for (let t = 0; t < 60; t++) {
    const tr = [0, 1, 2].map(() => ({ s: Math.floor(Math.random() * SHAPES.length), k: Math.floor(Math.random() * 7) }));
    if (tr.some(p => anyFit(SHAPES[p.s]))) return tr;
  }
  return [0, 1, 2].map(() => ({ s: 0, k: Math.floor(Math.random() * 7) }));
}
function saveGame() { try { localStorage.setItem(gkey(), JSON.stringify(G)); } catch (e) {} }
function newGame() {
  G = { grid: emptyGrid(), tray: [null, null, null], score: 0, streak: 0 };
  G.tray = genTray(); busy = false;
  saveGame(); render(); renderTray();
}
function loadGame() {
  try {
    const g = JSON.parse(localStorage.getItem(gkey()));
    if (g && g.grid && g.grid.length === N && g.tray && g.tray.length === 3) { G = g; busy = false; render(); renderTray(); stuckCheck(); return; }
  } catch (e) {}
  newGame();
}

function findClears(grid) {
  const set = new Set(); let lines = 0;
  for (let r = 0; r < N; r++) if (grid[r].every(v => v >= 0)) { lines++; for (let c = 0; c < N; c++) set.add(r * N + c); }
  for (let c = 0; c < N; c++) { let full = true; for (let r = 0; r < N; r++) if (grid[r][c] < 0) { full = false; break; } if (full) { lines++; for (let r = 0; r < N; r++) set.add(r * N + c); } }
  return { set, lines };
}

function place(i, r, c) {
  const p = G.tray[i], sh = SHAPES[p.s];
  sh.cells.forEach(([dr, dc]) => { G.grid[r + dr][c + dc] = p.k; });
  G.tray[i] = null; G.score += sh.cells.length;
  const { set, lines } = findClears(G.grid);
  const same = sameColorLines();
  renderTray();
  if (set.size) {
    G.streak++;
    G.score += lines * lines * 10 + (G.streak > 1 ? (G.streak - 1) * 10 : 0);
    sfx('clear', lines); praise(lines, G.streak);
    if (same.length) { const pal = TH().pal; fireworks(same.map(k => pal[k])); }
    busy = true; render();
    set.forEach(idx => cells[idx].classList.add('clr'));
    setTimeout(() => { set.forEach(idx => { G.grid[(idx / N) | 0][idx % N] = -1; }); busy = false; afterMove(); }, 300);
  } else {
    G.streak = 0; sfx('place'); render(); afterMove();
  }
}

function afterMove() {
  if (G.tray.every(p => !p)) { G.tray = genTray(); renderTray(); sfx('new'); }
  if (G.score > cur().best) { cur().best = G.score; saveS(); }
  render(); saveGame(); stuckCheck();
}

function stuckCheck() {
  const left = G.tray.filter(Boolean);
  if (!left.length || left.some(p => anyFit(SHAPES[p.s]))) return;
  if (cur().calm) { rescue(); return; }
  gameOver();
}

function rescue() {
  toast('✨ Making some room!');
  const filled = [];
  for (let i = 0; i < N * N; i++) if (G.grid[(i / N) | 0][i % N] >= 0) filled.push(i);
  filled.sort(() => Math.random() - .5);
  filled.slice(0, 18).forEach(i => { G.grid[(i / N) | 0][i % N] = -1; });
  sfx('clear', 2); render(); saveGame();
  const left = G.tray.filter(Boolean);
  if (!left.some(p => anyFit(SHAPES[p.s]))) { G.tray = genTray(); renderTray(); }
}

function gameOver() {
  const isBest = G.score > 0 && G.score >= cur().best;
  sfx('over');
  try { localStorage.removeItem(gkey()); } catch (e) {}
  openModal(`<h2>${isBest ? '🎉 New best!' : 'Game over'}</h2><p style="font-size:42px;font-weight:900;margin:4px 0">${G.score}</p><p>Best: ${cur().best}</p><button class="big" id="again">Play again</button>`,
    c => { c.querySelector('#again').onclick = () => { closeModal(); newGame(); }; });
}

/* ---------- Same-colour lines + fireworks ---------- */
function sameColorLines() {
  const ks = [];
  for (let r = 0; r < N; r++) { const v = G.grid[r][0]; if (v >= 0 && G.grid[r].every(x => x === v)) ks.push(v); }
  for (let c = 0; c < N; c++) {
    const v = G.grid[0][c]; if (v < 0) continue;
    let ok = true; for (let r = 1; r < N; r++) if (G.grid[r][c] !== v) { ok = false; break; }
    if (ok) ks.push(v);
  }
  return ks;
}
const fxCv = document.createElement('canvas');
fxCv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';
document.body.appendChild(fxCv);
const fxCtx = fxCv.getContext('2d');
const fw = { parts: [], launchEnd: 0, next: 0, colors: [], raf: 0 };
function burst(x, y, color) {
  const n = 48;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.random() * .15, sp = 2 + Math.random() * 4.4;
    fw.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: .012 + Math.random() * .01, color });
  }
}
function fwLoop(t) {
  const W = innerWidth, H = innerHeight;
  fxCtx.clearRect(0, 0, W, H);
  if (t < fw.launchEnd && t >= fw.next) {
    burst(W * (.15 + Math.random() * .7), H * (.12 + Math.random() * .38), fw.colors[Math.floor(Math.random() * fw.colors.length)]);
    fw.next = t + 260 + Math.random() * 200;
  }
  fw.parts = fw.parts.filter(p => p.life > 0);
  for (const p of fw.parts) {
    p.vy += .06; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    const r = 2.6 * Math.max(p.life, 0) + .8;
    fxCtx.globalAlpha = Math.max(p.life, 0) * .45; fxCtx.fillStyle = '#fff';
    fxCtx.beginPath(); fxCtx.arc(p.x, p.y, r + 2.2, 0, 6.2832); fxCtx.fill();
    fxCtx.globalAlpha = Math.max(p.life, 0); fxCtx.fillStyle = p.color;
    fxCtx.beginPath(); fxCtx.arc(p.x, p.y, r, 0, 6.2832); fxCtx.fill();
  }
  fxCtx.globalAlpha = 1;
  if (t < fw.launchEnd || fw.parts.length) fw.raf = requestAnimationFrame(fwLoop);
  else { fxCtx.clearRect(0, 0, W, H); fw.raf = 0; }
}
function fireworks(colors) {
  const dpr = window.devicePixelRatio || 1;
  fxCv.width = innerWidth * dpr; fxCv.height = innerHeight * dpr; fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const now = performance.now();
  fw.colors = colors; fw.launchEnd = now + 1900; fw.next = now;
  if (!fw.raf) fw.raf = requestAnimationFrame(fwLoop);
  sfx('fireworks');
  const d = document.createElement('div'); d.className = 'float'; d.style.top = '14%'; d.textContent = '🎆 COLOR MATCH! 🎆';
  $('#floaty').appendChild(d); setTimeout(() => d.remove(), 1200);
}

/* ---------- Praise / effects ---------- */
function praise(lines, streak) {
  const words = ['Nice!', 'Great!', 'Awesome!', 'Amazing!', 'Incredible!', 'LEGENDARY!'];
  let txt = words[Math.min(words.length - 1, lines - 1 + (streak > 2 ? 1 : 0))];
  if (streak > 1) txt += ' x' + streak;
  const wrap = $('#floaty'), d = document.createElement('div');
  d.className = 'float'; d.textContent = txt; wrap.appendChild(d); setTimeout(() => d.remove(), 1200);
  const fx = TH().fx, n = Math.min(10, 3 + lines * 2);
  for (let i = 0; i < n; i++) {
    const e = document.createElement('div'); e.className = 'emo'; e.textContent = fx[i % fx.length];
    e.style.left = (30 + Math.random() * 40) + '%'; e.style.top = (30 + Math.random() * 30) + '%';
    e.style.setProperty('--dx', ((Math.random() - .5) * 220) + 'px'); e.style.setProperty('--dy', ((Math.random() - .8) * 200) + 'px');
    wrap.appendChild(e); setTimeout(() => e.remove(), 1200);
  }
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1900); }

/* ---------- Sound ---------- */
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = .15, delay = 0) {
  if (!AC || !S.sound) return;
  const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + delay;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v, s + .01); g.gain.exponentialRampToValueAtTime(.0001, s + d);
  o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + d + .02);
}
function sfx(kind, n = 1) {
  if (kind === 'place') tone(300, .12, 'triangle', .2);
  else if (kind === 'clear') { const sc = [523, 659, 784, 1047, 1319, 1568]; for (let i = 0; i < Math.min(6, n + 2); i++) tone(sc[i], .22, 'triangle', .18, i * .07); }
  else if (kind === 'new') { tone(440, .08, 'sine', .1); tone(554, .08, 'sine', .1, .07); }
  else if (kind === 'fireworks') { for (let i = 0; i < 7; i++) { tone(180 + Math.random() * 500, .18, 'square', .05, i * .27); tone(900 + Math.random() * 900, .12, 'triangle', .04, i * .27 + .05); } }
  else if (kind === 'over') { [392, 330, 262, 196].forEach((f, i) => tone(f, .3, 'sawtooth', .1, i * .16)); }
}

/* ---------- Dragging ---------- */
const LIFT = 64;
$('#tray').addEventListener('pointerdown', e => {
  if (busy || !$('#modal').hidden || drag) return;
  const slot = e.target.closest('.slot'); if (!slot) return;
  const i = +slot.dataset.i, p = G.tray[i]; if (!p) return;
  e.preventDefault(); initAudio();
  const c0 = cells[0].getBoundingClientRect(), c1 = cells[1].getBoundingClientRect();
  const pitch = c1.left - c0.left, cs = c0.width, sh = SHAPES[p.s], t = TH();
  const w = sh.w * pitch - (pitch - cs), h = sh.h * pitch - (pitch - cs);
  const ghost = document.createElement('div'); ghost.className = 'ghost';
  ghost.style.width = w + 'px'; ghost.style.height = h + 'px';
  sh.cells.forEach(([r, c]) => {
    const d = document.createElement('div'); d.className = 'gc';
    d.style.cssText = `left:${c*pitch}px;top:${r*pitch}px;width:${cs}px;height:${cs}px;background:${t.pal[p.k]}`;
    ghost.appendChild(d);
  });
  document.body.appendChild(ghost);
  slot.classList.add('lift');
  drag = { i, p, sh, ghost, pitch, c0, w, h, target: null };
  moveDrag(e);
});
function moveDrag(e) {
  const d = drag, gl = e.clientX - d.w / 2, gt = e.clientY - d.h - LIFT;
  d.ghost.style.transform = `translate(${gl}px,${gt}px)`;
  const col = Math.round((gl - d.c0.left) / d.pitch), row = Math.round((gt - d.c0.top) / d.pitch);
  render();
  if (canPlace(d.sh, row, col)) {
    d.target = [row, col];
    const t = TH(), color = t.pal[d.p.k];
    const tmp = G.grid.map(r => r.slice());
    d.sh.cells.forEach(([dr, dc]) => { const idx = (row + dr) * N + col + dc; cells[idx].classList.add('hint'); cells[idx].style.setProperty('--h', color); tmp[row + dr][col + dc] = d.p.k; });
    findClears(tmp).set.forEach(idx => cells[idx].classList.add('will'));
  } else d.target = null;
}
window.addEventListener('pointermove', e => { if (drag) { e.preventDefault(); moveDrag(e); } }, { passive: false });
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null; d.ghost.remove(); slots[d.i].classList.remove('lift');
  if (d.target) place(d.i, d.target[0], d.target[1]); else render();
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* ---------- Modals ---------- */
const modal = $('#modal'), card = $('#card');
function openModal(html, mount) { card.innerHTML = html; modal.hidden = false; if (mount) mount(card); }
function closeModal() { modal.hidden = true; card.innerHTML = ''; }

function whoModal() {
  const p0 = cur();
  openModal(`<h2>Who's playing?</h2>
    <div class="plist">${S.players.map((p, i) => `<button class="pbtn ${i === S.cur ? 'on' : ''}" data-i="${i}"><span>${THEMES[p.theme].icon} ${esc(p.name)}</span><small>Best ${p.best}</small></button>`).join('')}</div>
    <h3>Theme for ${esc(p0.name)}</h3>
    <div class="tlist">${Object.entries(THEMES).map(([k, t]) => `<button class="tbtn ${p0.theme === k ? 'on' : ''}" data-t="${k}">${t.icon}<small>${t.name}</small></button>`).join('')}</div>
    <button class="big" id="done">Let's play!</button>`, c => {
    c.querySelectorAll('.pbtn').forEach(b => b.onclick = () => { switchPlayer(+b.dataset.i); whoModal(); });
    c.querySelectorAll('.tbtn').forEach(b => b.onclick = () => { cur().theme = b.dataset.t; saveS(); applyTheme(); render(); renderTray(); whoModal(); });
    c.querySelector('#done').onclick = () => { closeModal(); checkTime(); };
  });
}
function switchPlayer(i) { S.cur = i; saveS(); applyTheme(); loadGame(); }

function askPin(title, ok, back) {
  openModal(`<h2>${title}</h2><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><p id="err" class="err"></p>
    <div class="row"><button id="no">Cancel</button><button class="big" id="yes" style="margin:0">OK</button></div>`, c => {
    const inp = c.querySelector('#pin'); setTimeout(() => inp.focus(), 80);
    c.querySelector('#no').onclick = () => { closeModal(); if (back) back(); };
    c.querySelector('#yes').onclick = () => ok(inp.value, c.querySelector('#err'));
    inp.onkeydown = ev => { if (ev.key === 'Enter') ok(inp.value, c.querySelector('#err')); };
  });
}
function parentGate(then, back) {
  if (!S.pin) {
    askPin('Choose a 4-digit parent PIN', (v, err) => {
      if (!/^\d{4}$/.test(v)) { err.textContent = 'Use exactly 4 digits'; return; }
      S.pin = v; saveS(); then();
    }, back);
  } else {
    askPin('Parent PIN', (v, err) => { if (v === S.pin) then(); else err.textContent = 'Wrong PIN'; }, back);
  }
}
function settings() {
  const opts = [0, 20, 30, 45, 60, 90, 120];
  openModal(`<h2>⚙️ Parent settings</h2>${S.players.map((p, i) => `
    <div class="prow" data-i="${i}">
      <input type="text" class="nm" maxlength="14" value="${esc(p.name)}">
      <label>Daily play limit<select class="lim">${opts.map(m => `<option value="${m}" ${p.limit === m ? 'selected' : ''}>${m ? m + ' min' : 'No limit'}</option>`).join('')}</select></label>
      <label>Calm mode (never game over)<input type="checkbox" class="calm" ${p.calm ? 'checked' : ''}></label>
      <div class="mins">Played today: ${p.day === dayStr() ? Math.floor(p.secs / 60) : 0} min</div>
    </div>`).join('')}
    <button class="big" id="save">Save</button>
    <div class="row"><button id="chpin">Change PIN</button><button id="close">Close</button></div>`, c => {
    c.querySelector('#save').onclick = () => {
      c.querySelectorAll('.prow').forEach(row => {
        const p = S.players[+row.dataset.i];
        p.name = row.querySelector('.nm').value.trim() || p.name;
        p.limit = +row.querySelector('.lim').value;
        p.calm = row.querySelector('.calm').checked;
      });
      saveS(); applyTheme(); closeModal(); toast('Saved ✓'); checkTime();
    };
    c.querySelector('#chpin').onclick = () => { S.pin = ''; saveS(); parentGate(settings, closeModal); };
    c.querySelector('#close').onclick = closeModal;
  });
}

/* ---------- Play-time limit ---------- */
const dayStr = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function checkTime() {
  const p = cur();
  if (p.day !== dayStr()) { p.day = dayStr(); p.secs = 0; saveS(); }
  if (p.limit && p.secs >= p.limit * 60) timesUp();
}
function timesUp() {
  const p = cur();
  openModal(`<h2>⏰ Time's up for today, ${esc(p.name)}!</h2><p style="font-size:42px;margin:4px 0">${TH().icon}</p><p>Great playing! Your best is ${p.best}.<br>See you tomorrow.</p>
    <div class="row"><button id="who2">Switch player</button><button id="more">Parent: +15 min</button></div>`, c => {
    c.querySelector('#who2').onclick = whoModal;
    c.querySelector('#more').onclick = () => parentGate(() => { p.secs = Math.max(0, p.secs - 900); saveS(); closeModal(); }, timesUp);
  });
}
setInterval(() => {
  const p = cur();
  if (p.day !== dayStr()) { p.day = dayStr(); p.secs = 0; }
  if (document.hidden || !modal.hidden || !p.limit) return;
  p.secs++;
  if (p.secs % 10 === 0) saveS();
  if (p.secs >= p.limit * 60) { saveS(); timesUp(); }
}, 1000);

/* ---------- Buttons ---------- */
$('#who').onclick = () => { initAudio(); whoModal(); };
$('#btnSound').onclick = () => { initAudio(); S.sound = !S.sound; saveS(); render(); sfx('new'); };
$('#btnNew').onclick = () => {
  if (G.score === 0) { newGame(); return; }
  openModal('<h2>Start a new game?</h2><p>Your current game will be lost.</p><div class="row"><button id="no">Keep playing</button><button class="big" id="yes" style="margin:0">New game</button></div>',
    c => { c.querySelector('#no').onclick = closeModal; c.querySelector('#yes').onclick = () => { closeModal(); newGame(); }; });
};
$('#btnParent').onclick = () => parentGate(settings, closeModal);

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- Boot ---------- */
applyTheme(); loadGame(); checkTime();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
